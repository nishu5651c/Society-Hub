databases:
  - name: societyhub-db
    databaseName: societyhub
    user: societyhub
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: societyhub
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    preDeployCommand: npm run db:migrate:deploy
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: societyhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: same-origin
      - key: PAYMENT_PROVIDER
        value: development
      - key: EMAIL_PROVIDER
        value: development
      - key: SMS_PROVIDER
        value: development
