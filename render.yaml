services:
  - type: web
    name: societyhub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: same-origin
      - key: PAYMENT_PROVIDER
        value: development
      - key: EMAIL_PROVIDER
        value: development
      - key: SMS_PROVIDER
        value: development
