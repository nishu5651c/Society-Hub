name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: societyhub
          POSTGRES_DB: societyhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U societyhub -d societyhub"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://societyhub:postgres@localhost:5432/societyhub?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run api:build
