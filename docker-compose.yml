services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: societyhub
      POSTGRES_USER: societyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U societyhub -d societyhub"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://societyhub:${POSTGRES_PASSWORD}@postgres:5432/societyhub?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-development}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-development}
      SMS_PROVIDER: ${SMS_PROVIDER:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build: .
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  postgres-data:
